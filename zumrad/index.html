<style>
@font-face { font-family:"Sofia Cond"; src:url(fonts/sofia-sans-extra-condensed-latin-500-normal.woff2) format("woff2"); font-weight:500; font-display:swap; }
@font-face { font-family:"Sofia Cond"; src:url(fonts/sofia-sans-extra-condensed-latin-600-normal.woff2) format("woff2"); font-weight:600; font-display:swap; }
@font-face { font-family:"Sofia"; src:url(fonts/sofia-sans-latin-400-normal.woff2) format("woff2"); font-weight:400; font-display:swap; }
@font-face { font-family:"Sofia"; src:url(fonts/sofia-sans-latin-500-normal.woff2) format("woff2"); font-weight:500; font-display:swap; }
@font-face { font-family:"Sofia"; src:url(fonts/sofia-sans-latin-600-normal.woff2) format("woff2"); font-weight:600; font-display:swap; }

:root {
  --ground:#13241E;      /* zumrad, sahifa foni (qavat kadrlari foni bilan bir xil) */
  --raised:#1B3129;      /* ko'tarilgan yuzalar */
  --stone:#ECE6DA;       /* fasad toshi: asosiy matn */
  --stone-2:#A9B6AD;     /* ikkinchi darajali matn */
  --verd:#8FB8A3;        /* tanlov, belgilash */
  --line:rgba(236,230,218,.16);
  --hot:rgba(143,184,163,.34);
  --cond:"Sofia Cond", "Arial Narrow", sans-serif;
  --text:"Sofia", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; background:var(--ground); color:var(--stone); font:400 15px/1.5 var(--text); overflow:hidden; overscroll-behavior:none; }
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
:focus-visible { outline:2px solid var(--verd); outline-offset:2px; }
.view { position:fixed; inset:0; display:none; }
body.v-building #building { display:grid; }
body.v-floor #floor { display:grid; }
.mark { font:600 26px/1 var(--cond); letter-spacing:.01em; margin:0; color:var(--stone); text-decoration:none; }

/* ---------------- Bino ---------------- */
#building { grid-template-columns:1fr 340px; }
.scene { position:relative; overflow:hidden; background:#2a2f2b; }
.stage { position:absolute; left:0; top:0; }
#snow { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.stage img, .stage svg { position:absolute; inset:0; width:100%; height:100%; display:block; }
.stage polygon { fill:transparent; stroke:transparent; stroke-width:1.5; vector-effect:non-scaling-stroke; cursor:pointer; transition:fill .18s, stroke .18s; outline:none; }
.stage polygon.on { fill:var(--hot); stroke:#D4E6DC; }
.stage polygon.off { cursor:default; }
#level { position:absolute; right:0; height:0; border-top:1px dashed #13241E; box-shadow:0 1px 0 rgba(236,230,218,.55); opacity:0; transition:opacity .18s; pointer-events:none; }
#level.on { opacity:1; }
.rail-col { position:relative; background:var(--ground); border-left:1px solid var(--line); }
.rail-col header { position:absolute; left:28px; right:24px; top:26px; }
.rail { position:absolute; inset:0; }
.lvl { position:absolute; left:0; right:0; display:grid; grid-template-columns:76px 1fr; align-items:center; padding:0 24px 0 28px; transform:translateY(-50%); text-align:left; }
.lvl b { font:600 var(--n, 40px)/1 var(--cond); font-variant-numeric:tabular-nums; color:var(--stone-2); transition:color .15s; }
.lvl span { font-size:13.5px; color:var(--stone-2); font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:12px; }
.lvl span::before { content:""; flex:none; width:22px; height:1px; background:currentColor; opacity:.55; transition:width .2s; }
button.lvl:hover b, button.lvl.on b, button.lvl:focus-visible b { color:var(--stone); }
button.lvl:hover span, button.lvl.on span { color:var(--stone); }
button.lvl:hover span::before, button.lvl.on span::before { width:40px; opacity:1; }
.lvl.ground { cursor:default; }
.lvl.ground b { color:rgba(169,182,173,.45); }
.rail-col footer { position:absolute; left:28px; right:24px; bottom:26px; }
.rail-col h1 { font:600 34px/1.05 var(--cond); margin:0 0 8px; }
.rail-col footer p { margin:0; color:var(--stone-2); font-size:14px; max-width:28ch; }

/* ---------------- Qavat ---------------- */
#floor { grid-template-columns:84px 1fr; grid-template-rows:auto 1fr auto; }
.fbar { grid-column:1 / -1; display:flex; align-items:center; gap:22px; padding:16px 28px; border-bottom:1px solid var(--line); }
.back { display:inline-flex; align-items:center; gap:10px; font-size:14px; color:var(--stone-2); padding:6px 2px; }
.back:hover { color:var(--stone); }
.back svg { width:18px; height:18px; }
.fbar .mark { font-size:22px; }
.fbar .title { margin-left:auto; display:flex; align-items:baseline; gap:12px; }
.fbar .title b { font:600 34px/1 var(--cond); }
.fbar .title span { color:var(--stone-2); font-size:14px; }
.frail { border-right:1px solid var(--line); display:flex; flex-direction:column; justify-content:center; gap:2px; padding:12px 0; }
.frail button { font:600 22px/1 var(--cond); color:var(--stone-2); padding:9px 0 9px 28px; text-align:left; position:relative; font-variant-numeric:tabular-nums; }
.frail button:hover { color:var(--stone); }
.frail button.on { color:var(--stone); }
.frail button.on::before { content:""; position:absolute; left:0; top:50%; width:18px; height:2px; background:var(--verd); }
.fmain { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:0; padding:8px 24px 0; }
.turn { position:relative; width:100%; max-width:calc((100dvh - 290px) * 16 / 9); aspect-ratio:16 / 9; overflow:hidden; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; }
.turn.drag { cursor:grabbing; }
.turn.zoomed { cursor:move; }
.zoomer { position:absolute; left:0; top:0; transform-origin:0 0; }
.zoomer img, .zoomer svg { position:absolute; inset:0; width:100%; height:100%; display:block; -webkit-user-drag:none; }
.zoomer img { pointer-events:none; }
.zoomer polygon { fill:transparent; stroke:transparent; stroke-width:1.5; vector-effect:non-scaling-stroke; cursor:pointer; transition:fill .15s, stroke .15s; outline:none; }
.zoomer polygon.hov { fill:rgba(236,230,218,.12); stroke:rgba(236,230,218,.6); }
.zoomer polygon.on { fill:var(--hot); stroke:#D4E6DC; }
.tag { position:absolute; transform:translate(-50%,-50%); pointer-events:none; width:30px; height:30px; display:grid; place-items:center; font:600 18px/1 var(--cond); background:var(--ground); color:var(--stone); border:1px solid rgba(236,230,218,.55); border-radius:2px; transition:background .15s, color .15s; }
.tag.on { background:var(--stone); color:var(--ground); border-color:var(--stone); }
#pre { position:absolute; inset:0; display:grid; place-items:center; color:var(--stone-2); font-size:13px; background:var(--ground); transition:opacity .4s; }
#pre.off { opacity:0; pointer-events:none; }
#hint { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); font-size:13px; color:var(--stone); background:rgba(19,36,30,.82); padding:7px 14px; border-radius:3px; pointer-events:none; transition:opacity .6s; white-space:nowrap; }
#hint.off { opacity:0; }
.zoomctl { position:absolute; right:10px; top:10px; display:flex; flex-direction:column; border:1px solid var(--line); background:rgba(19,36,30,.8); border-radius:3px; }
.zoomctl button { width:38px; height:38px; font-size:20px; line-height:1; color:var(--stone); }
.zoomctl button + button { border-top:1px solid var(--line); }
.zoomctl button:disabled { opacity:.35; cursor:default; }
.scrub { position:relative; width:100%; max-width:calc((100dvh - 290px) * 16 / 9); height:34px; margin-top:6px; cursor:ew-resize; touch-action:none; }
.scrub i { position:absolute; bottom:8px; width:1px; height:7px; background:var(--stone-2); opacity:.45; }
.scrub i.major { height:13px; opacity:.8; }
.scrub .needle { position:absolute; bottom:4px; width:2px; height:22px; background:var(--verd); transform:translateX(-1px); }
.apts { grid-column:2; display:grid; grid-template-columns:repeat(4, minmax(0,1fr)) minmax(260px, 1.3fr); border-top:1px solid var(--line); }
.apt { display:grid; grid-template-columns:auto 1fr; align-items:baseline; column-gap:14px; padding:16px 22px 18px; text-align:left; border-right:1px solid var(--line); transition:background .15s, color .15s; }
.apt b { font:600 44px/1 var(--cond); }
.apt span { font-size:15px; font-variant-numeric:tabular-nums; }
.apt small { grid-column:2; font-size:12.5px; color:var(--stone-2); }
.apt:hover, .apt.hov { background:var(--raised); }
.apt.on { background:var(--stone); color:var(--ground); }
.apt.on small { color:rgba(19,36,30,.7); }
.act { display:flex; align-items:center; padding:14px 24px; }
.act a { display:inline-block; text-decoration:none; background:var(--verd); color:var(--ground); font-weight:600; font-size:15.5px; padding:14px 22px; border-radius:3px; }
.act a:hover { background:#A6CBB8; }
.act p { margin:0; color:var(--stone-2); font-size:14px; max-width:30ch; }

/* ---------------- Telefon ---------------- */
@media (max-width:820px), (max-aspect-ratio:1/1) {
  html, body { overflow:auto; height:auto; }
  .view { position:static; min-height:100dvh; }
  #building { grid-template-columns:1fr; grid-template-rows:auto 58vh auto; }
  .mbar { display:flex !important; align-items:center; padding:14px 18px; }
  .rail-col { border-left:0; display:flex; flex-direction:column; }
  .rail-col header { display:none; }
  .rail, .rail-col footer { position:static; }
  .rail { display:grid; grid-template-columns:repeat(3,1fr); gap:0; border-top:1px solid var(--line); }
  .lvl { position:static; transform:none; grid-template-columns:1fr; padding:12px 18px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); }
  .lvl:nth-child(3n) { border-right:0; }
  .lvl b { font-size:34px !important; }
  .lvl span { font-size:12.5px; }
  .lvl span::before { display:none; }
  button.lvl.on { background:var(--raised); }
  .lvl.ground { display:none; }
  .rail-col footer { order:-1; padding:18px 18px 14px; }
  .rail-col h1 { font-size:28px; }
  #level { display:none; }
  #floor { grid-template-columns:1fr; grid-template-rows:none; align-content:start; }
  .fbar { padding:12px 16px; gap:14px; }
  .fbar .mark { display:none; }
  .fbar .title b { font-size:28px; }
  .frail { flex-direction:row; border-right:0; border-bottom:1px solid var(--line); overflow-x:auto; padding:0 8px; gap:0; scrollbar-width:none; }
  .frail::-webkit-scrollbar { display:none; }
  .frail button { padding:12px 12px 14px; font-size:20px; }
  .frail button.on::before { left:12px; right:12px; top:auto; bottom:0; width:auto; }
  .fmain { padding:10px 0 0; }
  .turn, .scrub { max-width:none; }
  .turn { aspect-ratio:4 / 3; }
  .scrub { width:calc(100% - 32px); }
  .apts { grid-column:1; grid-template-columns:repeat(4,1fr); }
  .apt { grid-template-columns:1fr; padding:12px 12px 14px; row-gap:2px; }
  .apt b { font-size:36px; }
  .apt small { grid-column:1; }
  .apt:nth-child(4) { border-right:0; }
  .act { grid-column:1 / -1; border-top:1px solid var(--line); padding:14px 16px 22px; }
  .act a { width:100%; text-align:center; }
}
.mbar { display:none; }
@media (min-width:821px) and (min-aspect-ratio:1/1) and (max-height:820px) { .rail-col footer p { display:none; } .rail-col h1 { font-size:28px; margin:0; } }
/* ---------------- Muhit ---------------- */
.envs { position:absolute; inset:0; z-index:0; }
.stage svg { z-index:1; }
.envs img { position:absolute; inset:0; width:100%; height:100%; display:block; opacity:0; transform:translateZ(0); backface-visibility:hidden; }
#snow { transition:opacity .9s; }
.env { position:absolute; left:28px; bottom:26px; z-index:3; background:rgba(19,36,30,.9); border:1px solid var(--line); border-radius:3px; padding:8px 6px; }
.g-time, .g-wx { display:flex; flex-direction:column; justify-content:flex-end; }
.btns { display:flex; }
.sky { position:relative; height:30px; margin:0 14px 2px; cursor:ew-resize; touch-action:none; outline:none; }
.sky:focus-visible { outline:2px solid var(--verd); outline-offset:2px; }
.arc { position:absolute; left:0; right:0; bottom:0; width:100%; height:24px; overflow:visible; }
.arc path { fill:none; stroke:rgba(236,230,218,.3); stroke-width:1; stroke-dasharray:2 3; vector-effect:non-scaling-stroke; }
.arc path.nightp { stroke:rgba(201,211,216,.22); }
.arc line { stroke:rgba(236,230,218,.18); stroke-width:1; vector-effect:non-scaling-stroke; }
.sun { position:absolute; left:0; top:0; width:11px; height:11px; margin:-5.5px 0 0 -5.5px; border-radius:50%; background:#F0CF85; box-shadow:0 0 0 3px rgba(240,207,133,.18), 0 0 14px 3px rgba(240,207,133,.45); transition:background .5s, box-shadow .5s, opacity .5s; pointer-events:none; }
.sun.night { background:#D5DEE2; box-shadow:0 0 0 3px rgba(213,222,226,.12), 0 0 10px 2px rgba(213,222,226,.3); }
.sun b { position:absolute; left:50%; bottom:15px; transform:translateX(-50%); font:500 11.5px/1 var(--text); font-variant-numeric:tabular-nums; color:var(--stone); white-space:nowrap; opacity:.85; }
.env.wx .sun { opacity:0; }
.env.wx .arc { opacity:.45; }
.envs img { will-change:opacity; }
.env-row { display:flex; align-items:stretch; }
.env-row button { display:grid; gap:1px; padding:6px 14px 4px; text-align:left; color:var(--stone-2); border-radius:2px; transition:color .2s, background .2s; }
.env-row button b { font:600 19px/1 var(--cond); letter-spacing:.01em; }
.env-row button span { font-size:12px; font-variant-numeric:tabular-nums; opacity:.8; }
.env-row button:hover { color:var(--stone); }
.env-row button[aria-checked="true"] { color:var(--stone); background:rgba(143,184,163,.16); }
.env-row .sep { width:1px; margin:30px 6px 4px; background:var(--line); }
@media (max-width:820px), (max-aspect-ratio:1/1) {
  .env { position:static; margin:0; border:0; border-bottom:1px solid var(--line); border-radius:0; background:var(--raised); padding:8px 8px 6px; order:-2; }
  .env-row, .g-time .btns { justify-content:space-between; }
  .g-time { flex:1; }
  .env-row button { padding:5px 6px 3px; }
  .env-row button b { font-size:17px; }
  .env-row button span { font-size:11px; }
  .env-row .sep { margin:28px 2px 4px; }
}
@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>

<script>
const BANDS = /*BANDS*/{"1":[[0.36,0.7659],[0.566,0.8049],[0.656,0.7685],[0.656,0.8437],[0.566,0.8985],[0.36,0.8398]],"2":[[0.36,0.7079],[0.566,0.7314],[0.656,0.7095],[0.656,0.7685],[0.566,0.8049],[0.36,0.7659]],"3":[[0.36,0.6499],[0.566,0.6579],[0.656,0.6504],[0.656,0.7095],[0.566,0.7314],[0.36,0.7079]],"4":[[0.36,0.5919],[0.566,0.5844],[0.656,0.5914],[0.656,0.6504],[0.566,0.6579],[0.36,0.6499]],"5":[[0.36,0.5338],[0.566,0.5108],[0.656,0.5323],[0.656,0.5914],[0.566,0.5844],[0.36,0.5919]],"6":[[0.36,0.4758],[0.566,0.4373],[0.656,0.4733],[0.656,0.5323],[0.566,0.5108],[0.36,0.5338]],"7":[[0.36,0.4178],[0.566,0.3638],[0.656,0.4142],[0.656,0.4733],[0.566,0.4373],[0.36,0.4758]],"8":[[0.36,0.3598],[0.566,0.2903],[0.656,0.3552],[0.656,0.4142],[0.566,0.3638],[0.36,0.4178]],"9":[[0.36,0.3017],[0.566,0.2167],[0.656,0.2961],[0.656,0.3552],[0.566,0.2903],[0.36,0.3598]],"10":[[0.36,0.2437],[0.566,0.1432],[0.656,0.2371],[0.656,0.2961],[0.566,0.2167],[0.36,0.3017]]}/*END*/;
const N = 144;
const APTS = [
  { k:'A', area:70 }, { k:'B', area:69 }, { k:'C', area:79 },
  { k:'D', area:110, tour:'/360/' }
];
const LEVEL = n => n === 1 ? '±0,00' : '+' + (4.2 + (n - 2) * 3.3).toFixed(2).replace('.', ',');
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const DPR = Math.min(window.devicePixelRatio || 1, 3);

/* ================= Bino ================= */
const scene = $('#scene'), stage = $('#stage'), hsvg = stage.querySelector('svg'), rail = $('#rail'), level = $('#level');
const bandPoly = {}, railBtn = {};
let cov = { x:0, y:0, w:1, h:1 };
for (let n = 10; n >= 1; n--) {
  const k = String(n), b = BANDS[k];
  const p = document.createElementNS(NS, 'polygon');
  p.setAttribute('points', b.map(q => (q[0]*1600).toFixed(1) + ',' + (q[1]*900).toFixed(1)).join(' '));
  if (n > 1) { p.addEventListener('pointerenter', () => hl(k, true)); p.addEventListener('pointerleave', () => hl(k, false)); p.addEventListener('click', () => go(n)); }
  else p.classList.add('off');
  hsvg.appendChild(p); bandPoly[k] = p;

    const f = lo === hi || lo < 0 ? 0 : (S - lo) / (hi - lo);
    for (let i = 0; i < N; i++) { const im = imgs[DAY[i].k];
      const o = i === lo ? 1 : i === hi ? f : 0; im.style.opacity = o; im.style.zIndex = i === hi && hi !== lo ? 2 : 1; }
    for (const w of WX) { const im = imgs[w.k]; im.style.opacity = wa[w.k]; im.style.zIndex = w.k === W ? 6 : 5; }
    const T = tOfS(S);
    const u = (T - SUNRISE) / (T1 - SUNRISE), x = 8 + 384 * u;
    let y; if (T <= SUNSET) { const q = (x - 8) / 332; y = 40 - 132 * q * (1 - q); } else y = 40 + 8 * (T - SUNSET) / (T1 - SUNSET);
    sunEl.style.left = (x / 4) + '%'; sunEl.style.top = (6 + y / 44 * 24) + 'px';
    sunEl.classList.toggle('night', T > SUNSET + 0.15);
    clock.textContent = hhmm(T); sky.setAttribute('aria-valuenow', T.toFixed(2)); sky.setAttribute('aria-valuetext', hhmm(T));
    for (const x of TIMES) btns[x.k].setAttribute('aria-checked', String(!W && Math.abs(T - x.t) < 0.2));
    for (const w of WX) btns[w.k].setAttribute('aria-checked', String(W === w.k));
    envEl.classList.toggle('wx', !!W);
  }

  // animatsiya: S (kun) va ob-havo qatlamlari bitta tsiklda
  let raf = 0;
  const easeIO = x => -(Math.cos(Math.PI * x) - 1) / 2;
  const still = () => matchMedia('(prefers-reduced-motion:reduce)').matches;
  function run(a) { cancelAnimationFrame(raf); const t0 = performance.now(), s0 = S, w0 = { ...wa };
    const D = Math.max(a.D || 0, a.wt ? a.WD : 0);
    (function st(now) { const el = now - t0;
      if (a.s1 != null) S = s0 + (a.s1 - s0) * easeIO(Math.min(1, el / a.D));
      if (a.wt) { const k = easeIO(Math.min(1, el / a.WD)); for (const w in a.wt) wa[w] = w0[w] + (a.wt[w] - w0[w]) * k; }
      paint(); if (el < D) raf = requestAnimationFrame(st); else { if (a.after) a.after(); paint(); save(); } })(t0);
  }
  function goTime(t) {
    const s1 = sOfT(t), steps = Math.abs(s1 - S);
    const D = still() ? 1 : Math.min(6500, Math.max(1500, steps * 560));
    const lo = Math.floor(Math.min(S, s1)), hi = Math.ceil(Math.max(S, s1));
    for (let i = lo; i <= hi; i++) load(DAY[i].k);            // kutmaymiz: yuklanganlari darhol qo'shiladi
    const hadW = !!W; W = ''; fx.set('');
    run({ s1, D, wt: hadW ? { yomgir: 0, qish: 0 } : null, WD: still() ? 1 : Math.max(2400, Math.min(D, 3200)) });
  }
  function setWx(k) {
    if (W === k) return; const w = WX.find(x => x.k === k);
    load(k).then(() => { if (W !== k) return; fx.set(w.fx);
      run({ wt: { ...wa, [k]: 1 }, WD: still() ? 1 : 2400, after: () => { for (const x of WX) if (x.k !== k) wa[x.k] = 0; } }); });
    W = k; paint();
  }
  function fadeWxOut() { run({ wt: { yomgir: 0, qish: 0 }, WD: 1600 }); }
  function save() { try { localStorage.setItem('zr-env2', JSON.stringify({ T: tOfS(S), W })); } catch (_) {} }

  // yoyni sudrash
  const tAt = cx => { const r = sky.getBoundingClientRect(); const x = (cx - r.left) / r.width * 400; return SUNRISE + (x - 8) / 384 * (T1 - SUNRISE); };
  let drag = false, dragRaf = 0, want = null;
  sky.addEventListener('pointerdown', e => { drag = true; try { sky.setPointerCapture(e.pointerId); } catch (_) {}
    DAY.forEach(d => load(d.k)); if (W) { W = ''; fx.set(''); fadeWxOut(); } else cancelAnimationFrame(raf); scrubTo(e.clientX); });
  sky.addEventListener('pointermove', e => { if (drag) scrubTo(e.clientX); });
  const endDrag = () => { if (drag) { drag = false; save(); } };
  sky.addEventListener('pointerup', endDrag); sky.addEventListener('pointercancel', endDrag);
  // sudrashda ham sakramasin: S maqsadga yumshoq yetib boradi
  function scrubTo(cx) { want = sOfT(tAt(cx)); if (!dragRaf) dragRaf = requestAnimationFrame(follow); }
  function follow() { dragRaf = 0; if (want == null) return; const d = want - S; S += Math.abs(d) < 0.003 ? d : d * 0.22; paint();
    if (Math.abs(want - S) > 0.0005) dragRaf = requestAnimationFrame(follow); else want = null; }
  sky.addEventListener('keydown', e => { const d = { ArrowLeft: -0.25, ArrowRight: 0.25, ArrowDown: -0.25, ArrowUp: 0.25, PageDown: -1, PageUp: 1 }[e.key];
    if (e.key === 'Home') { e.preventDefault(); goTime(T0); } else if (e.key === 'End') { e.preventDefault(); goTime(T1); }
    else if (d) { e.preventDefault(); goTime(tOfS(S) + d); } });

  // boshlanish
  let st = null; try { st = JSON.parse(localStorage.getItem('zr-env2') || 'null'); } catch (_) {}
  if (st && typeof st.T === 'number') { S = sOfT(st.T); W = WX.some(w => w.k === st.W) ? st.W : ''; } else W = 'qish';
  if (W) { wa[W] = 1; load(W).then(() => fx.set(WX.find(w => w.k === W).fx)); }
  [Math.floor(S), Math.ceil(S)].forEach(i => load(DAY[i].k));
  paint();
  // qolganlari: joriy vaqtga yaqinidan boshlab, birin-ketin
  setTimeout(async () => { const order = DAY.map((d, i) => [i, d.k]).sort((a, b) => Math.abs(a[0] - S) - Math.abs(b[0] - S)).map(x => x[1]).concat(WX.map(w => w.k));
    for (const k of order) await load(k); }, 400);
  return { goTime, setWx };
})();

/* telefonda muhit paneli rasm ostiga ko'chadi */
(() => {
  const envEl = $('#env'), scn = $('#scene'), col = $('.rail-col'), mq = matchMedia('(max-width:820px), (max-aspect-ratio:1/1)');
  const place = () => { if (mq.matches) { if (envEl.parentNode !== col) col.prepend(envEl); } else if (envEl.parentNode !== scn) scn.appendChild(envEl); };
  mq.addEventListener('change', place); place();
})();
</script>
</body>

<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Siyovush House</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Siyovush House turar joy majmuasi: bloklar, qavatlar va xonadonlar.">
<meta name="theme-color" content="#161a18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
/* IDEA: the picture is the page. Controls are small panes of smoked glass at the edges; nothing sits on the building.
   Three screens: building -> floor (3D cutaway) -> apartment (360 tour). Each is a full screen of its own. */
:root{
  --ink:#f4f2ec;--mute:rgba(244,242,236,.68);--faint:rgba(244,242,236,.14);--hair:rgba(255,255,255,.16);
  --glass:rgba(22,27,24,.5);--glass2:rgba(255,255,255,.07);--gold:#d9b673;
  --free:#63d49b;--hold:#f0c355;--sold:#e8776b;--pad:14px;
  color-scheme:dark;
}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:#161a18;color:var(--ink);font:400 14px/1.45 Geologica,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,select{font:inherit;color:inherit;cursor:pointer}
button{background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}
.glass{background:var(--glass);border:1px solid var(--hair);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 14px 40px rgba(0,0,0,.3);
  -webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(22,27,24,.92)}}
.pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;white-space:nowrap}
.ico{width:40px;padding:0;justify-content:center;font-size:17px}
.sel{position:relative;padding:0}
.sel select{appearance:none;-webkit-appearance:none;background:none;border:0;height:40px;padding:0 30px 0 14px;border-radius:999px;outline-offset:2px}
.sel select option{background:#1d2320;color:#f4f2ec}
.sel::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--mute);border-bottom:1.5px solid var(--mute);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.mute{color:var(--mute)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;height:40px}
.seg button{height:32px;padding:0 13px;border-radius:999px;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--ink);color:#161a18;font-weight:500}

.bar{position:fixed;z-index:20;left:var(--pad);right:var(--pad);top:var(--pad);display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.bar>*{pointer-events:auto}
.bar .sp{flex:1;pointer-events:none}
.brand{font-weight:500;letter-spacing:-.01em}
.brand svg{width:18px;height:18px;flex:none}

/* ---------- building ---------- */
.stage{position:fixed;inset:0;overflow:hidden;background:#161a18}
.stage .blur{position:absolute;inset:-40px;background:center/cover no-repeat;filter:blur(30px) brightness(.9) saturate(1.2)}
.art{position:absolute;left:0;top:0;width:2048px;height:1152px;transform-origin:0 0;will-change:transform}
.art img{position:absolute;inset:0;width:100%;height:100%;transition:filter 1.2s}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.hot{fill:rgba(255,255,255,0);stroke:rgba(255,255,255,.5);stroke-width:3;stroke-linejoin:round;cursor:pointer;transition:fill .25s,stroke .25s}
.hot:hover,.hot:focus-visible,.hot.sel{fill:rgba(217,182,115,.28);stroke:#fff;outline:0}
.dim{fill:rgba(12,15,13,.55);pointer-events:none}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(12,15,13,.45),transparent 16%,transparent 78%,rgba(12,15,13,.5))}
.chip{position:absolute;transform:translate(-50%,-50%);height:32px;padding:0 12px 0 4px;gap:7px;font-size:13px;transition:opacity .25s}
.chip i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#161a18;font-style:normal;font-weight:500;font-size:13px}
.chip.off{opacity:0;pointer-events:none}
.time output{font-variant-numeric:tabular-nums;min-width:2.8em}
.time input{width:110px;margin:0;accent-color:var(--gold);background:none}
.foot{position:fixed;z-index:20;left:var(--pad);bottom:var(--pad);display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 2*var(--pad))}
.stat{gap:12px}.stat b{font-weight:500}.stat span{display:inline-flex;align-items:center;gap:6px}
.views{gap:3px;padding:3px}
.views button{width:54px;height:34px;border-radius:999px;overflow:hidden;opacity:.6;border:1px solid transparent}
.views button img{width:100%;height:100%;object-fit:cover;display:block}
.views button.on{opacity:1;border-color:var(--gold)}

/* block panel: chessboard */
.side{position:fixed;z-index:15;right:var(--pad);top:calc(var(--pad) + 48px);width:300px;max-height:calc(100dvh - 2*var(--pad) - 48px);border-radius:20px;padding:14px;overflow:auto;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.side h2{font-size:18px;font-weight:500;letter-spacing:-.01em}
.side .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.board{display:grid;gap:3px}
.frow{display:grid;grid-template-columns:34px repeat(var(--n),1fr);gap:3px}
.frow a.q{display:grid;place-items:center;height:30px;border-radius:8px;font-weight:500;background:var(--glass2);border:1px solid var(--hair)}
.frow a.q:hover{border-color:var(--gold);color:var(--gold)}
.cell{display:grid;place-items:center;height:30px;border-radius:8px;font-size:13px;background:color-mix(in srgb,var(--c) 24%,transparent);border:1px solid color-mix(in srgb,var(--c) 60%,transparent)}
.cell:hover{background:color-mix(in srgb,var(--c) 46%,transparent)}
.cell.sold{background:transparent;border-color:var(--hair);color:rgba(244,242,236,.4);text-decoration:line-through}
.colh{display:grid;grid-template-columns:34px repeat(var(--n),1fr);gap:3px;font-size:11px;color:var(--mute);text-align:center}
.note{font-size:12px;color:var(--mute)}

/* ---------- floor page ---------- */
.page{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 40%,#2a302c 0,#161a18 70%);display:flex;flex-direction:column}
.fwrap{flex:1;position:relative;margin:62px var(--pad) 8px;min-height:0}
.fview{position:absolute;inset:0;display:grid;place-items:center}
.fbox{position:relative;max-width:100%;max-height:100%}
.fbox img{display:block;max-width:100%;max-height:calc(100dvh - 150px);width:auto;height:auto}
.fbox.plan img{background:#fbfaf7;border-radius:14px}
.fbox svg{position:absolute;inset:0;width:100%;height:100%}
.ap{stroke:rgba(255,255,255,.9);stroke-width:2;vector-effect:non-scaling-stroke;cursor:pointer;fill-opacity:.07;transition:fill-opacity .2s}
.ap:hover,.ap:focus-visible,.ap.on{fill-opacity:.38;outline:0}
.ap.sold{cursor:default;fill-opacity:.3}
.aptag{position:absolute;transform:translate(-50%,-50%);pointer-events:none;height:26px;padding:0 9px;font-size:12px;gap:6px}
.spin{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.spin:active{cursor:grabbing}.spin img{pointer-events:none;-webkit-user-drag:none}
.spin .ap{transition:none}
.pt3{fill:var(--gold);stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke;cursor:pointer}
.un{fill:var(--gold)}
.hint{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);height:26px;padding:0 10px;font-size:12px;color:var(--mute);pointer-events:none;white-space:nowrap}
.rot{position:absolute;top:50%;transform:translateY(-50%);z-index:3}
.rot.l{left:0}.rot.r{right:0}
.flist{flex:none;display:flex;gap:6px;overflow-x:auto;padding:0 var(--pad) var(--pad);scrollbar-width:none}
.flist::-webkit-scrollbar{display:none}
.flist a{flex:none;height:44px;border-radius:14px;padding:0 12px;display:flex;align-items:center;gap:10px;background:var(--glass2);border:1px solid var(--hair)}
.flist a:hover,.flist a.on{border-color:var(--gold)}
.flist a.sold{opacity:.5}
.flist b{font-weight:500}
.flist small{display:block;font-size:11px;color:var(--mute);line-height:1.2}

/* ---------- apartment: 360 ---------- */
.tour{position:fixed;inset:0;background:#0d100f;touch-action:none;cursor:grab}
.tour:active{cursor:grabbing}
.tour canvas{display:block;width:100%;height:100%}
.load{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);background:#0d100f;transition:opacity .4s;pointer-events:none}
.split{position:absolute;top:0;bottom:0;width:44px;margin-left:-22px;cursor:ew-resize;z-index:4;touch-action:none}
.split::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 12px rgba(0,0,0,.5)}
.split::after{content:"‹ ›";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#fff;color:#161a18;display:grid;place-items:center;font-weight:600;letter-spacing:2px}
.cl{position:absolute;top:64px;z-index:4;height:28px;padding:0 10px;font-size:12px;pointer-events:none}
.tb{position:fixed;z-index:25;left:var(--pad);right:var(--pad);bottom:var(--pad);display:flex;gap:8px;align-items:flex-end;pointer-events:none}
.tb>*{pointer-events:auto}
.mini{width:150px;border-radius:14px;padding:6px;flex:none}
.tour~.bar,.tour~.tb{transition:opacity .22s}
body.look .tour~.bar,body.look .tour~.tb{opacity:.08}
body.clean .tour~.tb,body.clean .tour~.bar>:not(.ico){display:none}
#clean[aria-pressed=true]{background:var(--ink);color:#fbfaf7}
.mini svg{display:block;width:100%;height:auto;border-radius:10px;background:#fbfaf7}
.mini .pt{fill:#161a18;stroke:#fbfaf7;stroke-width:2;vector-effect:non-scaling-stroke;cursor:pointer}
.mini .pt.on{fill:var(--gold)}
.mini .cone{fill:rgba(190,120,10,.5);stroke:#8a5a00;stroke-width:1.5;vector-effect:non-scaling-stroke;pointer-events:none}
.mini p{font-size:11px;color:var(--mute);margin:6px 2px 0}
.rooms{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:center}
.rooms::-webkit-scrollbar{display:none}
.rooms button{flex:none;height:36px;padding:0 13px;border-radius:999px;font-size:13px;color:var(--mute)}
.rooms button.on{color:var(--ink);border-color:var(--gold)}
.cta{background:var(--gold);color:#1d1708;font-weight:500;border:0;flex:none}
.info{gap:10px}.info b{font-weight:500}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mute);padding:20px}

.adm{position:fixed;inset:60px var(--pad) var(--pad);border-radius:20px;padding:14px;overflow:auto}
.adm table{width:100%;border-collapse:collapse;font-size:13px}
.adm th,.adm td{border-bottom:1px solid var(--hair);padding:5px;text-align:left;font-weight:400}
.adm select{color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--hair);border-radius:8px;height:32px;max-width:100%}

@media(max-width:760px){
  :root{--pad:10px}
  .brand span,.time input{display:none}
  .side{left:var(--pad);right:var(--pad);width:auto;top:auto;bottom:calc(var(--pad) + 48px);max-height:46dvh}
  .stat .x{display:none}
  .mini{width:98px;padding:4px}
  .mini p{display:none}
  .tb{flex-wrap:wrap}
  .rooms{order:3;flex:0 0 100%;justify-content:flex-start}
  .info .x{display:none}
  .fwrap{margin-top:108px}
  .fbox img{max-height:calc(100dvh - 210px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
{
const ST={free:{t:"Bo'sh",c:'var(--free)'},hold:{t:'Bron',c:'var(--hold)'},sold:{t:'Sotilgan',c:'var(--sold)'}};
const FLOORS=[2,3,4,5,6,7,8,9],BL=['1','2','3'];
const VIEWS=[[3,"Ko'cha tomoni",{x0:330,y0:150,x1:1475,y1:985}],[4,'Hovli tomoni',{x0:200,y0:120,x1:1848,y1:1040}],[1,'Burchakdan',{x0:120,y0:60,x1:1500,y1:1000}],[2,'Yon tomondan',{x0:500,y0:40,x1:1900,y1:1000}]];
const ar=a=>a.toFixed(1).replace('.',',');
let P=null,FL=null,PTS={},status={},route={},T={s:1,x:0,y:0};
const S={view:0,fv:0,fmode:'3d',pmode:'3d',nospin:{}};
const SHOPS=[{"id":"d11","t":"Do'kon 1","k":"shop","a":64.6},{"id":"d12","t":"Do'kon 2","k":"shop","a":64.6},{"id":"d13","t":"Do'kon 3","k":"shop","a":64.6},{"id":"d14","t":"Do'kon 4","k":"shop","a":64.6},{"id":"d15","t":"Do'kon 5","k":"shop","a":64.6},{"id":"l1","t":"1-blok kirish lobbisi","k":"lobby","a":35.1},{"id":"c3","t":"Burchak kafe","k":"cafe","a":259.5},{"id":"d36","t":"Do'kon 6","k":"shop","a":105.6},{"id":"d37","t":"Do'kon 7","k":"shop","a":100.0},{"id":"l3","t":"3-blok kirish lobbisi","k":"lobby","a":55.4},{"id":"d28","t":"Do'kon 8","k":"shop","a":58.5},{"id":"d29","t":"Do'kon 9","k":"shop","a":58.5},{"id":"d210","t":"Do'kon 10","k":"shop","a":58.5},{"id":"d211","t":"Do'kon 11","k":"shop","a":58.5},{"id":"l2","t":"2-blok kirish lobbisi","k":"lobby","a":45.7}],SPD={};
const $=id=>document.getElementById(id),app=$('app');
const key=(b,f,n)=>`b${b}-q${f}-x${n}`,st=k=>status[k]||'free';
const BRAND=`<a class="pill glass brand" href="#" aria-label="Siyovush House, bosh sahifa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M12 2l4 4-4 4-4-4zM12 14l4 4-4 4-4-4zM2 12l4-4 4 4-4 4zM14 12l4-4 4 4-4 4z"/></svg><span>Siyovush House</span></a>`;
const sel=(id,label,opts,val)=>`<label class="pill glass sel"><select id="${id}" aria-label="${label}">${opts.map(o=>`<option value="${o[0]}"${o[0]==val?' selected':''}>${o[1]}</option>`).join('')}</select></label>`;
const legend=()=>`<div class="legend">${Object.values(ST).map(o=>`<span><i class="dot" style="background:${o.c}"></i>${o.t}</span>`).join('')}</div>`;

/* ---------- data ---------- */
function loadLocal(){try{return JSON.parse(localStorage.getItem('sb-status')||'{}')}catch(e){return {}}}
function setStatus(k,v){status[k]=v;const l=loadLocal();l[k]=v;try{localStorage.setItem('sb-status',JSON.stringify(l))}catch(e){}}
function count(b,f){const c={free:0,hold:0,sold:0};for(const q of (f?[f]:FLOORS))for(const a of P[b].apts)c[st(key(b,q,a.n))]++;return c}

/* ---------- building ---------- */
function fit(){
  const art=$('art');if(!art)return;
  const W=innerWidth,H=innerHeight,side=$('side'),ph=W<=760;
  const fr={x:0,y:56,w:W-(side&&!ph?320:0),h:H-56-(ph&&side?H*.46+60:60)};
  const F=VIEWS[S.view][2],fw=F.x1-F.x0,fh=F.y1-F.y0,cover=Math.max(W/2048,H/1152);
  const want=Math.min(fr.w/fw,fr.h/fh)*.96,s=ph?Math.min(cover,want):Math.max(cover,Math.min(want,cover*1.6));
  let x=fr.x+fr.w/2-(F.x0+fw/2)*s,y=fr.y+fr.h/2-(F.y0+fh/2)*s;
  if(2048*s>=W)x=Math.min(0,Math.max(W-2048*s,x));
  if(1152*s>=H)y=Math.min(0,Math.max(H-1152*s,y));
  T={s,x,y};art.style.transform=`translate(${x}px,${y}px) scale(${s})`;
  document.querySelectorAll('#chips .chip').forEach(el=>{const h=P[el.dataset.b].hot;let cx=0,top=1e9,bot=0;for(const p of h){cx+=p[0];top=Math.min(top,p[1]);bot=Math.max(bot,p[1])}cx/=h.length;
    el.style.left=(x+cx*s)+'px';el.style.top=(y+(top*.8+bot*.2)*s)+'px'});
}
function sun(){
  const i=$('sun');if(!i)return;const h=+i.value,hh=Math.floor(h),mm=Math.round((h-hh)*60);
  $('sunv').textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  const f=h<7.5?'brightness(.78) saturate(.8) sepia(.35) hue-rotate(-12deg)':h<10?'brightness(.95) saturate(1.05) sepia(.15)':h<16?'none':h<18.5?'brightness(.96) saturate(1.15) sepia(.32) hue-rotate(-8deg)':h<19.6?'brightness(.72) saturate(1.1) sepia(.45) hue-rotate(-18deg)':'brightness(.42) saturate(.7) hue-rotate(185deg) sepia(.2)';
  $('hero').style.filter=f;S.sun=h;
}
function board(b){
  const pl=P[b],n=pl.apts.length;
  return `<div class="board"><div class="colh" style="--n:${n}"><span></span>${pl.apts.map(a=>`<span>${a.area.toFixed(0)} m²</span>`).join('')}</div>
  ${[9,8,7,6,5,4,3,2].map(q=>`<div class="frow" style="--n:${n}"><a class="q" href="#b${b}-q${q}" title="${q}-qavatni ochish" aria-label="${q}-qavat">${q}</a>${pl.apts.map(a=>{const s=st(key(b,q,a.n));return `<a class="cell ${s}" style="--c:${ST[s].c}" href="#b${b}-q${q}-x${a.n}" aria-label="${q}-qavat, ${a.n}-xonadon, ${ar(a.area)} m², ${ST[s].t}">${a.rooms}</a>`}).join('')}</div>`).join('')}
  <div class="frow" style="--n:1"><a class="q" href="#b${b}-q1" aria-label="1-qavat">1</a><a class="cell" style="--c:var(--gold)" href="#b${b}-q1">Do'konlar va kirish lobbisi</a></div>
  <div class="frow" style="--n:1"><a class="q" href="#parking" aria-label="Yer osti parking">−1</a><a class="cell" style="--c:var(--gold)" href="#parking">Yer osti parking · 3D va 360°</a></div></div>`;
}
function vHome(b){
  const all={free:0,hold:0,sold:0};for(const x of BL){const c=count(x);for(const k in all)all[k]+=c[k]}
  const v=VIEWS[S.view],hot=v[0]==3,c=b?count(b):null;
  app.innerHTML=`<div class="stage"><div class="blur" style="background-image:url(img/t${v[0]}.webp)"></div>
    <div class="art" id="art"><img id="hero" src="img/r${v[0]}.webp" alt="Siyovush House: ${v[1]}" width="2048" height="1152">
      <svg viewBox="0 0 2048 1152">${hot?(b?`<path class="dim" fill-rule="evenodd" d="M0 0H2048V1152H0Z M${P[b].hot.map(p=>p.join(' ')).join(' L')}Z"/>`:'')+BL.map(x=>`<polygon class="hot${x==b?' sel':''}" data-b="${x}" tabindex="0" role="link" aria-label="${x}-blok" points="${P[x].hot.map(p=>p.join(',')).join(' ')}"/>`).join(''):''}</svg></div>
    <div class="shade"></div><div id="chips">${hot?BL.map(x=>`<a class="pill glass chip${b?' off':''}" data-b="${x}" href="#b${x}"><i>${x}</i>blok</a>`).join(''):''}</div></div>
  <header class="bar">${BRAND}${sel('sb','Blok',[['','Blokni tanlang'],...BL.map(x=>[x,x+'-blok'])],b||'')}
    <a class="pill glass" href="#parking">Parking</a><span class="sp"></span>
    <label class="pill glass time" title="Kun vaqti"><output id="sunv">13:00</output><input type="range" id="sun" min="6" max="21" step="0.25" value="${S.sun||13}" aria-label="Kun vaqti"></label></header>
  ${b?`<aside class="side glass" id="side"><div class="hd"><h2>${b}-blok</h2><a class="pill glass ico" href="#" aria-label="Yopish" style="height:32px;width:32px">×</a></div>
    <p class="note">${c.free} bo'sh · ${c.hold} bron · ${c.sold} sotilgan</p>${legend()}${board(b)}
    <p class="note">Qavat raqami: qavatning 3D ko'rinishi. Katak: xonadon va 360° sayr. Katakdagi son: xonalar.</p></aside>`:''}
  <footer class="foot"><div class="pill glass views" role="group" aria-label="Ko'rinish">${VIEWS.map((x,i)=>`<button data-v="${i}" class="${i==S.view?'on':''}" title="${x[1]}" aria-label="${x[1]}" aria-pressed="${i==S.view}"><img src="img/t${x[0]}.webp" alt=""></button>`).join('')}</div>

    const near=f=>{const k=((Math.round(f)%n)+n)%n;for(let d=0;d<n/2;d++){if(ok[(k+d)%n])return (k+d)%n;if(ok[(k-d+n)%n])return (k-d+n)%n}return -1};
    const show=()=>{const k=near(F);if(k<0||k==shown)return;shown=k;img.src=ims[k].src;
      for(const e of els){const q=D.polys[e.dataset.i][k];if(q.length==2){e.setAttribute('cx',q[0]*W);e.setAttribute('cy',q[1]*H)}else{let s='';for(let i=0;i<q.length;i+=2)s+=(q[i]*W).toFixed(1)+','+(q[i+1]*H).toFixed(1)+' ';e.setAttribute('points',s)}}
      for(const t of tags){const q=D.polys[t.dataset.t][k];let x=0,y=0;for(let i=0;i<q.length;i+=2){x+=q[i];y+=q[i+1]}t.style.left=x/(q.length/2)*100+'%';t.style.top=y/(q.length/2)*100+'%'}};
    const tick=now=>{raf=0;const dt=Math.min(50,now-(lt||now-16));lt=now;if(!held){Tg+=vel*dt;vel*=Math.exp(-dt/420);if(Math.abs(vel)<1e-4)vel=0}
      const d=Tg-F;F=Math.abs(d)<.02?Tg:F+d*(1-Math.exp(-dt/60));S['fr_'+name]=F;show();if(Math.abs(Tg-F)>.02||vel||held)go();else lt=0};
    const go=()=>{if(!raf)raf=requestAnimationFrame(tick)};
    const ld=i=>{const im=new Image();im.onload=()=>{ok[i]=true;ims[i]=im;if(shown<0||near(F)==i)show()};im.src=`tt/${name}/${String(i).padStart(3,'0')}.webp`};
    const k0=((Math.round(F)%n)+n)%n;ld(k0);for(const st of [16,8,4,2,1])for(let i=0;i<n;i+=st)if(i!=k0&&(st==16||i%(st*2)))setTimeout(ld,st==16?0:st==8?250:st==4?700:st==2?1400:2400,i);
    const mvf=e=>{if(!held)return;const dx=e.clientX-lx,now=performance.now(),dt=Math.max(8,now-lm),k=n/(box.clientWidth*1.15)*1.3;lx=e.clientX;lm=now;mv+=Math.abs(dx);if(mv>6)box.dataset.drag=1;Tg-=dx*k;vel=vel*.6-dx*k/dt*.4;go()};
    const upf=()=>{if(!held)return;held=false;if(performance.now()-lm>90)vel=0;removeEventListener('pointermove',mvf);removeEventListener('pointerup',upf);removeEventListener('pointercancel',upf);go()};
    box.addEventListener('pointerdown',e=>{held=true;lx=e.clientX;lm=performance.now();vel=0;mv=0;delete box.dataset.drag;addEventListener('pointermove',mvf);addEventListener('pointerup',upf);addEventListener('pointercancel',upf);const h=box.querySelector('.hint');if(h)h.remove()});

  };

  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
  const U=n=>gl.getUniformLocation(pr,n),uR=U('r'),uV=U('v'),uS=U('s'),flip=el.dataset.flip=='1';
  gl.uniform1f(U('f'),flip?1:0);gl.uniform1i(U('t'),0);gl.uniform1i(U('t2'),1);
  const tex=[0,1].map(i=>{const x=gl.createTexture();gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,x);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,1,1,0,gl.RGB,gl.UNSIGNED_BYTE,new Uint8Array([13,16,15]));return x});
  let ready=false,raf=0,tok=[0,0],two=false;
  const sp=$('split'),cA=$('clA'),cB=$('clB'),cone=$('cone');
  const draw=()=>{raf=0;const dpr=Math.min(devicePixelRatio||1,2),w=Math.round(cv.clientWidth*dpr),h=Math.round(cv.clientHeight*dpr);
    if(!w||!h)return;if(cv.width!=w||cv.height!=h){cv.width=w;cv.height=h}
    gl.viewport(0,0,w,h);gl.uniform2f(uR,w,h);gl.uniform3f(uV,V.yaw,V.pitch,V.fov);gl.uniform1f(uS,two?V.split:-1);gl.drawArrays(gl.TRIANGLES,0,3);
    if(two){sp.style.left=V.split*100+'%';sp.setAttribute('aria-valuenow',Math.round(V.split*100));cA.style.right=`calc(${(1-V.split)*100}% + 30px)`;cB.style.left=`calc(${V.split*100}% + 30px)`}
    const p=pts[V.room];if(cone&&p){const R=span*.22,hf=Math.atan(Math.tan(V.fov/2)*cv.clientWidth/cv.clientHeight),y=flip?-V.yaw:V.yaw,q=g=>[p[0]+R*Math.sin(g),p[1]-R*Math.cos(g)],A=q(y-hf),B=q(y+hf);
      cone.setAttribute('d',`M${p[0]} ${p[1]}L${A[0]} ${A[1]}A${R} ${R} 0 0 1 ${B[0]} ${B[1]}Z`)}};
  const ask=()=>{if(!raf)raf=requestAnimationFrame(draw)};
  const load=(i,url)=>{const my=++tok[i],im=new Image();if(!i){ld.style.opacity=1;ld.textContent='Yuklanmoqda…'}
    im.onload=()=>{if(my!=tok[i])return;const max=gl.getParameter(gl.MAX_TEXTURE_SIZE);let src=im;
      if(im.width>max){const c=document.createElement('canvas');c.width=max;c.height=max/2;c.getContext('2d').drawImage(im,0,0,c.width,c.height);src=c}
      gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,tex[i]);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,src);if(!i){ready=true;ld.style.opacity=0}ask()};
    im.onerror=()=>{if(my==tok[i]&&!i){ld.style.opacity=1;ld.textContent="Rasm yuklanmadi. Qayta urinib ko'ring."}};im.src=url};
  const cmp=on=>{two=on;sp.hidden=cA.hidden=cB.hidden=!on;if(on){cA.textContent=REN.find(r=>r[0]==V.ren)[1];cB.textContent=REN.find(r=>r[0]==V.ren2)[1]}ask()};
  const pp=new Map();let pinch=0,drag=false;
  /* silliq kamera: T — maqsad, V — ekrandagi holat; qo'yib yuborilganda inersiya */
  const T={yaw:V.yaw,pitch:V.pitch,fov:V.fov},L={yaw:V.yaw,pitch:V.pitch,fov:V.fov},vel=[0,0];let held=false,lt=0,lm=0,anim=0;
  const GAIN=1.6,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  const sync=()=>{for(const k in T)if(V[k]!=L[k]){T[k]=V[k];if(k!='fov')vel[0]=vel[1]=0}};
  const tick=now=>{anim=0;sync();const dt=Math.min(50,now-(lt||now-16));lt=now;
    if(!held){T.yaw+=vel[0]*dt;T.pitch=cl(T.pitch+vel[1]*dt,-1.35,1.35);const d=Math.exp(-dt/380);vel[0]*=d;vel[1]*=d;if(Math.hypot(vel[0],vel[1])<2e-6)vel[0]=vel[1]=0}
    const a=1-Math.exp(-dt/70);let mv=0;
    for(const k in T){const d=T[k]-V[k];mv=Math.max(mv,Math.abs(d));V[k]=Math.abs(d)<1e-4?T[k]:V[k]+d*a;L[k]=V[k]}
    draw();if(mv>1e-4||vel[0]||vel[1]||held)go();else lt=0};
  const go=()=>{if(!anim)anim=requestAnimationFrame(tick)};
  const ui=on=>document.body.classList.toggle('look',on);
  el.addEventListener('pointerdown',e=>{if(e.target==sp){drag=true;sp.setPointerCapture(e.pointerId);return}el.setPointerCapture(e.pointerId);pp.set(e.pointerId,[e.clientX,e.clientY]);sync();held=true;vel[0]=vel[1]=0;lm=performance.now();go()});
  el.addEventListener('pointermove',e=>{if(drag){V.split=Math.max(.04,Math.min(.96,e.clientX/el.clientWidth));ask();return}
    const p=pp.get(e.pointerId);if(!p)return;
    if(pp.size==1){sync();const k=V.fov/cv.clientHeight*GAIN,dx=-(e.clientX-p[0])*k,dy=(e.clientY-p[1])*k,now=performance.now(),dt=Math.max(8,now-lm);lm=now;T.yaw+=dx;T.pitch=cl(T.pitch+dy,-1.35,1.35);vel[0]=vel[0]*.6+dx/dt*.4;vel[1]=vel[1]*.6+dy/dt*.4;if(Math.abs(dx)+Math.abs(dy)>.002)ui(true)}
    pp.set(e.pointerId,[e.clientX,e.clientY]);
    if(pp.size==2){const [q,w]=[...pp.values()],d=Math.hypot(q[0]-w[0],q[1]-w[1]);if(pinch){sync();T.fov=cl(T.fov*pinch/d,.6,1.8)}pinch=d;vel[0]=vel[1]=0}
    go()});
  const up=e=>{drag=false;pp.delete(e.pointerId);pinch=0;if(!pp.size){held=false;if(performance.now()-lm>90)vel[0]=vel[1]=0;ui(false);go()}};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{e.preventDefault();sync();T.fov=cl(T.fov*(1+Math.sign(e.deltaY)*.1),.6,1.8);go()},{passive:false});
  sp.addEventListener('keydown',e=>{if(e.key=='ArrowLeft'||e.key=='ArrowRight'){V.split=Math.max(.04,Math.min(.96,V.split+(e.key=='ArrowLeft'?-.03:.03)));ask()}});
  new ResizeObserver(ask).observe(cv);
  return {load,ask,cmp,el};
}
function vAdmin(){
  const rows=[];
  for(const b of BL)for(const q of FLOORS)rows.push(`<tr><td>${b}-blok</td><td>${q}</td>${[1,2,3,4,5,6].map(i=>{const a=P[b].apts.find(x=>x.n==i);if(!a)return '<td></td>';const k=key(b,q,a.n);return `<td><select data-k="${k}" aria-label="${b}-blok ${q}-qavat ${a.n}-xonadon">${Object.entries(ST).map(([v,o])=>`<option value="${v}"${st(k)==v?' selected':''}>${o.t}</option>`).join('')}</select></td>`}).join('')}</tr>`);
  app.innerHTML=`<div class="page"><header class="bar"><a class="pill glass ico" href="#" aria-label="Bosh sahifa">‹</a>${BRAND}<span class="pill glass">Boshqaruv · o'zgarishlar faqat shu brauzerda saqlanadi</span></header>
  <div class="adm glass"><table><thead><tr><th>Blok</th><th>Qavat</th>${[1,2,3,4,5,6].map(n=>`<th>${n}-x.</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div></div>`;
}

/* ---------- router ---------- */
function parse(){const h=location.hash.slice(1);let m;
  if(h=='admin')return{admin:1};if(h=='parking')return{park:1};
  if(m=h.match(/^b(?:lok-)?([123])(?:-q([1-9]))?(?:-x([1-6]))?$/))return{b:m[1],f:m[2]?+m[2]:null,x:m[3]?+m[3]:null};
  return{}}
function render(){
  if(!P)return;PV=null;document.body.classList.remove('look');route=parse();let {b,f,x}=route;
  if(x&&!P[b].apts.some(a=>a.n==x))x=route.x=null;
  if(x&&!f)f=route.f=5;
  if(route.admin)vAdmin();else if(route.park)vPark();else if(f==1)vShop(b);else if(x)vApt(b,f,x);else if(f)vFloor(b,f);else vHome(b);
}
app.addEventListener('click',e=>{
  const t=e.target,q=s=>t.closest(s);let z;
  if((z=q('#clean'))){z.setAttribute('aria-pressed',document.body.classList.toggle('clean'));return}
  if($('fbox')&&$('fbox').dataset.drag&&q('#fbox'))return;
  if((z=q('[data-pm]'))){S.pmode=z.dataset.pm;render();return}
  if((z=q('[data-room3]'))){V.room=z.dataset.room3;const r=PARK.rooms.find(k=>k[0]==V.room);V.yaw=r[2];V.pitch=0;S.pmode='360';render();return}
  if((z=q('.hot'))){location.hash='b'+z.dataset.b;return}
  if((z=q('[data-v]'))){S.view=+z.dataset.v;render();return}
  if((z=q('[data-fm]'))){S.fmode=z.dataset.fm;render();return}
  if((z=q('[data-rot]'))){S.fv=(S.fv+ +z.dataset.rot+4)%4;render();return}
  if((z=q('polygon.ap'))){if(z.dataset.x&&!z.classList.contains('sold'))location.hash=`b${route.b}-q${route.f}-x${z.dataset.x}`;return}
  if((z=q('#rA [data-r]'))){V.ren=z.dataset.r;if(V.ren2==V.ren){V.ren2='';$('cmp').value=''}loadPano();return}
  if((z=q('[data-room]'))){V.room=z.dataset.room;const r=(route.park?PARK:TOURS[route.b+'-'+route.x]).rooms.find(k=>k[0]==V.room);V.yaw=r[2];V.pitch=0;loadPano();return}
  if(q('#cta')){q('#cta').textContent="Sotuv bo'limi raqami shu yerda bo'ladi"}
});
app.addEventListener('keydown',e=>{const z=e.target.closest('.hot,polygon.ap,.pt,.pt3,[data-room3]');if(z&&(e.key=='Enter'||e.key==' ')){e.preventDefault();z.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
app.addEventListener('change',e=>{const t=e.target;
  if(t.id=='sb'){location.hash=t.value?('b'+t.value+(route.f?'-q'+route.f:'')):'';return}
  if(t.id=='sf'){location.hash=`b${route.b}-q${t.value}`;return}
  if(t.id=='cmp'){V.ren2=t.value==V.ren?'':t.value;if(!V.ren2)t.value='';V.split=.5;loadPano();return}
  const s=t.closest('select[data-k]');if(s)setStatus(s.dataset.k,s.value)});
app.addEventListener('input',e=>{if(e.target.id=='sun')sun()});
app.addEventListener('pointerover',e=>{const z=e.target.closest('.flist a');document.querySelectorAll('polygon.ap').forEach(p=>p.classList.toggle('on',!!z&&(z.dataset.x?p.dataset.x==z.dataset.x:p.dataset.u==z.dataset.u)))});
addEventListener('hashchange',render);addEventListener('resize',fit);
Promise.all([fetch('plans.json').then(r=>r.json()),fetch('fl.json').then(r=>r.ok?r.json():null).catch(()=>null),fetch('status.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({}))])
 .then(([p,fl,s])=>{P=p;if(fl){FL=fl.views;PTS=fl.pts||{}}status=Object.assign({},s,loadLocal());render()})
 .catch(()=>{app.innerHTML='<div class="empty">Ma\'lumot yuklanmadi. Sahifani yangilang.</div>'});
}

<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Siyovush House</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Siyovush House turar joy majmuasi: bloklar, qavatlar va xonadonlar.">
<meta name="theme-color" content="#161a18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
/* IDEA: the sales-office maquette seen through glass. The render never leaves the screen;
   everything else is a pane of smoked glass laid over it.
   COLOUR: smoked green-black glass, white ink, ornament gold from the facade panels for selection only.
   TYPE: Geologica alone. Light 200 for names and figures, 400/500 for reading.
   LAYOUT: desktop = picture + one glass pane on the right; phone = picture + bottom sheet under the thumb. */
:root{
  --ink:#f4f2ec;--mute:rgba(244,242,236,.66);--faint:rgba(244,242,236,.14);--hair:rgba(255,255,255,.16);
  --glass:rgba(22,27,24,.46);--glass2:rgba(255,255,255,.07);--gold:#d9b673;
  --free:#63d49b;--hold:#f0c355;--sold:#e8776b;
  --peek:46dvh;--pad:20px;
  color-scheme:dark;
}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:#161a18;color:var(--ink);font:400 16px/1.5 Geologica,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
h1,h2,h3,p{margin:0}
.fig{font-weight:200;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

.glass{background:var(--glass);border:1px solid var(--hair);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 24px 60px rgba(0,0,0,.35);
  -webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(22,27,24,.9)}}

/* ---------- picture ---------- */
.stage{position:fixed;inset:0;overflow:hidden;background:#161a18}
.stage .back{position:absolute;inset:-40px;background:center/cover no-repeat;filter:blur(34px) brightness(.95) saturate(1.3)}
.art{position:absolute;left:0;top:0;width:2048px;height:1152px;transform-origin:0 0;will-change:transform}
.art img{position:absolute;inset:0;width:100%;height:100%;transition:filter 1.2s}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.hot{fill:rgba(255,255,255,0);stroke:rgba(255,255,255,.55);stroke-width:3;stroke-linejoin:round;cursor:pointer;transition:fill .3s,stroke .3s}
.hot:hover,.hot:focus-visible,.hot.sel{fill:rgba(217,182,115,.3);stroke:#fff;outline:0}
.dim{fill:rgba(12,15,13,.6);pointer-events:none}
.clouds{position:absolute;inset:-20% -40%;pointer-events:none;mix-blend-mode:multiply;opacity:.34;
  background:radial-gradient(28% 18% at 20% 30%,#566170 0,transparent 70%),radial-gradient(22% 16% at 60% 55%,#566170 0,transparent 70%),radial-gradient(30% 20% at 85% 25%,#566170 0,transparent 70%),radial-gradient(18% 14% at 40% 80%,#566170 0,transparent 70%);
  filter:blur(30px);animation:drift 70s linear infinite alternate}
@keyframes drift{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(12,15,13,.5),transparent 22%,transparent 60%,rgba(12,15,13,.55))}

.chip{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:999px;white-space:nowrap;font-size:14px;transition:opacity .3s,background .3s}
.chip b{font-weight:500}
.chip i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#161a18;font-style:normal;font-weight:500;font-size:14px}
.chip span{color:var(--mute)}
.chip:hover{background:rgba(22,27,24,.7)}
.chip.off{opacity:0;pointer-events:none}

/* ---------- top bar ---------- */
.top{position:fixed;z-index:6;left:var(--pad);top:var(--pad);display:flex;gap:10px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;height:48px;padding:0 18px 0 14px;border-radius:999px;font-weight:500;letter-spacing:-.01em}
.brand svg{width:22px;height:22px;flex:none}
.time{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:999px}
.time output{font-size:18px;min-width:2.9em}
.time input{width:150px;height:44px;margin:0;accent-color:var(--gold);background:none}

.title{position:fixed;z-index:5;left:var(--pad);bottom:calc(var(--pad) + 4px);pointer-events:none;max-width:min(60vw,900px);text-shadow:0 2px 30px rgba(0,0,0,.45)}
.title h1{font-weight:200;font-size:clamp(56px,8.4vw,148px);line-height:.92;letter-spacing:-.055em;text-wrap:balance}
.title p{margin-top:14px;font-size:17px;color:rgba(255,255,255,.86);max-width:36ch}
.title h1 span{display:inline-block;animation:rise .9s cubic-bezier(.2,.7,.1,1) both}
.title h1 span:nth-child(2){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(.35em)}to{opacity:1;transform:none}}

/* ---------- pane ---------- */
.pane{position:fixed;z-index:10;right:var(--pad);top:var(--pad);bottom:var(--pad);width:404px;border-radius:30px;display:flex;flex-direction:column;overflow:hidden;transition:width .45s cubic-bezier(.3,.8,.2,1);animation:in .7s .25s both}
.pane.wide{width:min(700px,calc(100vw - 2*var(--pad)))}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.grab{display:none}
.dock{flex:none;display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--hair)}
.dock a{flex:1;display:grid;place-items:center;height:44px;border-radius:999px;font-size:15px;color:var(--mute);transition:background .25s,color .25s}
.dock a:hover{color:var(--ink)}
.dock a.on{background:var(--ink);color:#161a18;font-weight:500}
.body{flex:1;overflow:auto;overscroll-behavior:contain;padding:22px 22px 28px;display:flex;flex-direction:column;gap:22px;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
.body>*{flex:none}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.head h2{font-weight:200;font-size:44px;line-height:1;letter-spacing:-.04em}
.head p{color:var(--mute);font-size:14px;margin-top:6px}
.back{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 12px;border-radius:999px;background:var(--glass2);border:1px solid var(--hair);font-size:14px;flex:none}
.back:hover{background:rgba(255,255,255,.14)}
.lead{font-size:17px;line-height:1.45;max-width:34ch}
.note{font-size:13px;color:var(--mute)}
h3{font-weight:400;font-size:14px;color:var(--mute)}

.facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--hair)}
.facts div{padding:14px 0 12px;border-bottom:1px solid var(--hair)}
.facts div:nth-child(odd){padding-right:14px}
.facts div:nth-child(even){padding-left:16px;border-left:1px solid var(--hair)}
.facts b{display:block;font-weight:200;font-size:40px;line-height:1;letter-spacing:-.04em}
.facts span{display:block;margin-top:6px;font-size:13px;color:var(--mute)}

.blk{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;padding:14px 16px;border-radius:18px;background:var(--glass2);border:1px solid var(--hair);transition:background .25s,border-color .25s}
.blk+.blk{margin-top:8px}
.blk:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.3)}
.blk .n{grid-row:span 2;font-weight:200;font-size:46px;line-height:1;letter-spacing:-.05em;width:.7em}
.blk b{font-weight:500}
.blk em{font-style:normal;font-size:13px;color:var(--mute)}
.blk .bar{grid-column:2/4}
.bar{display:flex;height:4px;border-radius:9px;overflow:hidden;background:var(--faint)}
.bar i{display:block}

.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -22px;padding:0 22px 4px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal button{flex:0 0 72%;scroll-snap-align:center;border-radius:16px;overflow:hidden}
.gal img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}

/* chessboard: floors x apartments */
.board{display:grid;gap:5px}
.frow{display:grid;grid-template-columns:52px repeat(var(--n),1fr);gap:5px;align-items:stretch}
.frow>a.q{display:grid;place-items:center start;font-weight:200;font-size:30px;letter-spacing:-.04em;line-height:1;border-radius:12px;padding-left:6px;min-height:44px}
.frow>a.q:hover{color:var(--gold)}
.cell{display:grid;place-items:center;min-height:44px;border-radius:12px;font-size:15px;color:var(--ink);background:color-mix(in srgb,var(--c) 24%,transparent);border:1px solid color-mix(in srgb,var(--c) 62%,transparent);transition:transform .2s,background .2s}
.cell:hover{transform:translateY(-2px);background:color-mix(in srgb,var(--c) 46%,transparent)}
.cell.sold{background:transparent;border-color:var(--hair);color:rgba(244,242,236,.38);text-decoration:line-through}
.frow.base{color:var(--mute);font-size:13px}
.frow.base .q{font-weight:200;font-size:30px;letter-spacing:-.04em;line-height:1;padding-left:6px;display:grid;place-items:center start;min-height:40px}
.frow.base .w{grid-column:2/-1;display:flex;align-items:center;padding:0 14px;border-radius:12px;border:1px dashed var(--hair)}
.colh{display:grid;grid-template-columns:52px repeat(var(--n),1fr);gap:5px;font-size:12px;color:var(--mute);text-align:center}

.step{display:flex;align-items:center;gap:6px}
.step a{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--glass2);border:1px solid var(--hair)}
.step a[aria-disabled=true]{opacity:.3;pointer-events:none}
.paper{position:relative;background:#fbfaf7;border-radius:20px;overflow:hidden}
.paper img{display:block;width:100%;height:auto}
.paper svg{position:absolute;inset:0;width:100%;height:100%}
.ap{stroke:#fbfaf7;stroke-width:5;cursor:pointer;opacity:.5;transition:opacity .2s}
.ap:hover,.ap:focus-visible{opacity:.85;stroke:#161a18;outline:0}
.aplab{font:500 46px Geologica,sans-serif;fill:#161a18;pointer-events:none;paint-order:stroke;stroke:#fbfaf7;stroke-width:9px}
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;min-height:56px;padding:8px 16px;border-radius:16px;background:var(--glass2);border:1px solid var(--hair);text-align:left;transition:background .25s}
.row:hover{background:rgba(255,255,255,.13)}
.row .a{font-weight:200;font-size:28px;letter-spacing:-.04em;line-height:1}
.row small{display:block;font-size:13px;color:var(--mute)}
.tagst{display:inline-flex;align-items:center;font-size:13px;white-space:nowrap}

.kv{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.kv div{padding:14px 0}
.kv div+div{padding-left:16px;border-left:1px solid var(--hair)}
.kv b{display:block;font-weight:200;font-size:44px;line-height:1;letter-spacing:-.04em}
.kv span{display:block;margin-top:6px;font-size:13px;color:var(--mute)}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--glass2);border:1px solid var(--hair)}
.seg button{flex:1;height:44px;border-radius:999px;font-size:15px;color:var(--mute)}
.seg button.on{background:var(--ink);color:#161a18;font-weight:500}
.pano{aspect-ratio:2/1;border-radius:20px;display:grid;place-items:center;text-align:center;padding:16px;border:1px dashed var(--hair);color:var(--mute);font-size:14px}
.pano b{display:block;color:var(--ink);font-weight:400;font-size:17px;margin-bottom:4px}
.view360{position:relative;border-radius:20px;overflow:hidden;background:#0d100f;aspect-ratio:16/10;touch-action:none;cursor:grab}
.view360:active{cursor:grabbing}
.view360 canvas{display:block;width:100%;height:100%}
.view360 .hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:6px 14px;border-radius:999px;font-size:13px;pointer-events:none;transition:opacity .5s;white-space:nowrap}
.view360 .full{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.view360 .load{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:var(--mute);background:#0d100f;transition:opacity .4s}
.view360.big{position:fixed;inset:0;z-index:60;border-radius:0;aspect-ratio:auto}
.view360.big .seg2{display:flex}
.seg2{display:none;position:absolute;left:50%;top:12px;transform:translateX(-50%);gap:4px;padding:4px;border-radius:999px}
.seg2 button{height:40px;padding:0 16px;border-radius:999px;font-size:14px;color:var(--mute)}
.seg2 button.on{background:var(--ink);color:#161a18;font-weight:500}
.chipsr{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -22px;padding:0 22px}
.chipsr::-webkit-scrollbar{display:none}
.chipsr button{flex:none;height:44px;padding:0 16px;border-radius:999px;background:var(--glass2);border:1px solid var(--hair);font-size:14px;color:var(--mute)}
.chipsr button.on{border-color:var(--gold);color:var(--ink)}
@media(max-width:860px){.view360{aspect-ratio:4/3}.chipsr{margin:0 -16px;padding:0 16px}}
.cta{display:flex;align-items:center;justify-content:center;height:54px;border-radius:999px;background:var(--gold);color:#1d1708;font-weight:500}

.adm table{width:100%;border-collapse:collapse;font-size:13px}
.adm th,.adm td{border-bottom:1px solid var(--hair);padding:6px 6px;text-align:left;font-weight:400}
.adm select{font:inherit;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--hair);border-radius:8px;height:36px;max-width:100%}
.scroll{overflow-x:auto}

.lb{position:fixed;inset:0;z-index:50;background:rgba(8,10,9,.92);display:none;place-items:center;padding:12px}
.lb.open{display:grid}.lb img{max-width:100%;max-height:92dvh;border-radius:14px}

/* ---------- phone ---------- */
@media(max-width:860px){
  :root{--pad:12px}
  .top{right:var(--pad);justify-content:space-between}
  .brand{height:44px;padding:0 14px 0 12px;font-size:15px}
  .time{height:44px;padding:0 12px}
  .time input{width:92px}
  .time output{font-size:16px}
  .title{top:auto;bottom:calc(var(--peek) + 12px);max-width:none;right:var(--pad)}
  .title h1{font-size:clamp(38px,12vw,60px)}
  .title p{display:none}
  .pane{left:0;right:0;top:auto;bottom:0;width:auto;height:var(--peek);border-radius:28px 28px 0 0;border-bottom:0;transition:height .45s cubic-bezier(.3,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
  .pane.wide{width:auto}
  .pane.open{height:calc(100dvh - 64px)}
  .grab{display:block;flex:none;height:26px;width:100%;touch-action:none}
  .grab::before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.45);margin:10px auto 0}
  .dock{padding:0 8px 8px}
  .body{padding:18px 16px 24px;gap:18px}
  .gal{margin:0 -16px;padding:0 16px 4px}
  .head h2{font-size:38px}
  .chip span{display:none}
  .chip{padding:6px 12px 6px 6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="stage" id="stage" aria-label="Majmuaning tepadan ko'rinishi">
  <div class="back" style="background-image:url(img/t3.webp)"></div>
  <div class="art" id="art">
    <img id="hero" src="img/r3.webp" alt="Siyovush House majmuasining tepadan ko'rinishi" width="2048" height="1152">
    <div class="clouds"></div>
    <svg id="hotsvg" viewBox="0 0 2048 1152"></svg>
  </div>
  <div class="shade"></div>
  <div id="chips"></div>
</div>

<header class="top">
  <a class="brand glass" href="#" aria-label="Siyovush House, bosh sahifa">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M12 2l4 4-4 4-4-4zM12 14l4 4-4 4-4-4zM2 12l4-4 4 4-4 4zM14 12l4-4 4 4-4 4z"/></svg>
    Siyovush House
  </a>
  <label class="time glass"><output class="fig" id="sunv">13:00</output><input type="range" id="sun" min="6" max="21" step="0.25" value="13" aria-label="Kun vaqti"></label>
</header>

<div class="title" id="over"></div>

<aside class="pane glass" id="pane">
  <button class="grab" id="grab" aria-label="Panelni ochish yoki yopish"></button>
  <nav class="dock" id="crumbs" aria-label="Bloklar"></nav>
  <div class="body" id="view"></div>
</aside>

<div class="lb" id="lb"><img alt=""></div>

<script>
{
const ST={free:{t:"Bo'sh",c:'var(--free)'},hold:{t:'Bron',c:'var(--hold)'},sold:{t:'Sotilgan',c:'var(--sold)'}};
const FLOORS=[2,3,4,5,6,7,8,9];
const FOCUS={x0:330,y0:150,x1:1475,y1:985};
const ar=a=>a.toFixed(2).replace('.',',');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let P=null,status={},localMode=true,route={},T={s:1,x:0,y:0};
const $=id=>document.getElementById(id);
const key=(b,f,n)=>`b${b}-q${f}-x${n}`;
const st=k=>status[k]||'free';
const phone=()=>matchMedia('(max-width:860px)').matches;

/* ---------- data ---------- */
function loadLocal(){try{return JSON.parse(localStorage.getItem('sb-status')||'{}')}catch(e){return {}}}
function setStatus(k,v){status[k]=v;const l=loadLocal();l[k]=v;try{localStorage.setItem('sb-status',JSON.stringify(l))}catch(e){}render()}
async function connect(){
  let base={};
  try{const r=await fetch('status.json',{cache:'no-store'});if(r.ok)base=await r.json()}catch(e){}
  status=Object.assign({},base,loadLocal());render();
}
function count(b,f){const c={free:0,hold:0,sold:0};for(const q of (f?[f]:FLOORS))for(const a of P[b].apts)c[st(key(b,q,a.n))]++;return c}
const bar=c=>{const t=c.free+c.hold+c.sold;return `<div class="bar">${['free','hold','sold'].map(s=>`<i style="width:${c[s]/t*100}%;background:${ST[s].c}"></i>`).join('')}</div>`};
const legend=()=>`<div class="legend">${Object.values(ST).map(o=>`<span><i class="dot" style="background:${o.c}"></i>${o.t}</span>`).join('')}</div>`;

/* ---------- picture: fit the buildings into the free part of the screen ---------- */
function fit(){
  const W=innerWidth,H=innerHeight,ph=phone();
  const pr=$('pane').getBoundingClientRect();
  const free=ph?{x:0,y:64,w:W,h:Math.max(200,H-Math.min(pr.height,H*.46)-64-56)}:{x:0,y:0,w:Math.max(320,pr.left),h:H};
  const fw=FOCUS.x1-FOCUS.x0,fh=FOCUS.y1-FOCUS.y0;
  const cover=Math.max(W/2048,H/1152);
  const want=Math.min(free.w/fw,free.h/fh)*(ph?1.06:.9);
  const s=ph?Math.min(cover,want):Math.max(cover,Math.min(want,cover*1.5));
  let x=free.x+free.w/2-(FOCUS.x0+fw/2)*s, y=free.y+free.h/2-(FOCUS.y0+fh/2)*s;
  if(2048*s>=W)x=Math.min(0,Math.max(W-2048*s,x));
  if(!ph)y=Math.min(0,Math.max(H-1152*s,y));
  T={s,x,y};
  $('art').style.transform=`translate(${x}px,${y}px) scale(${s})`;
  placeChips();
}
function drawHot(sel){
  const svg=$('hotsvg');let h='';
  if(sel){h+=`<path class="dim" fill-rule="evenodd" d="M0 0H2048V1152H0Z M${P[sel].hot.map(p=>p.join(' ')).join(' L')}Z"/>`}
  for(const b of ['1','2','3'])h+=`<polygon class="hot${b==sel?' sel':''}" data-b="${b}" tabindex="0" role="link" aria-label="${b}-blok" points="${P[b].hot.map(p=>p.join(',')).join(' ')}"/>`;
  svg.innerHTML=h;
  $('chips').innerHTML=['1','2','3'].map(b=>{const c=count(b);return `<a class="chip glass${sel?' off':''}" data-b="${b}" href="#blok-${b}"><i>${b}</i><b>blok</b><span>${c.free} ta bo'sh</span></a>`}).join('');
  placeChips();
}
function placeChips(){
  if(!P)return;
  document.querySelectorAll('#chips .chip').forEach(el=>{
    const h=P[el.dataset.b].hot;let x=0,y=1e9;for(const p of h){x+=p[0];if(p[1]<y)y=p[1]}x/=h.length;
    const ys=h.map(p=>p[1]);const cy=(Math.min(...ys)+Math.max(...ys))/2;

let PV=null;
function pano(el){
  const cv=el.querySelector('canvas'),gl=cv.getContext('webgl',{antialias:false});
  if(!gl){el.querySelector('.load').textContent="Bu qurilmada 360 ko'rinish ochilmadi.";return null}
  const sh=(t,src)=>{const o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);return o};
  const pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
  gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,`precision highp float;uniform sampler2D t;uniform vec2 r;uniform vec3 v;uniform float f;
   void main(){vec2 p=gl_FragCoord.xy/r*2.-1.;p.x*=r.x/r.y;vec3 d=normalize(vec3(p,1./tan(v.z*.5)));
   float cp=cos(v.y),sp=sin(v.y);d=vec3(d.x,d.y*cp+d.z*sp,-d.y*sp+d.z*cp);
   float cy=cos(v.x),sy=sin(v.x);d=vec3(d.x*cy+d.z*sy,d.y,-d.x*sy+d.z*cy);
   float u=atan(d.x,d.z)/6.2831853+.5;if(f>.5)u=1.-u;gl_FragColor=texture2D(t,vec2(u,acos(clamp(d.y,-1.,1.))/3.14159265));}`));
  gl.linkProgram(pr);gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const a=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
  const uR=gl.getUniformLocation(pr,'r'),uV=gl.getUniformLocation(pr,'v');gl.uniform1f(gl.getUniformLocation(pr,'f'),el.dataset.flip=='1'?1:0);
  const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

  const ask=()=>{if(!raf)raf=requestAnimationFrame(draw)};
  const load=url=>{const my=++token,im=new Image(),ld=el.querySelector('.load');ld.style.opacity=ready?.0:1;ld.textContent='Yuklanmoqda…';if(!ready)ld.style.opacity=1;
    im.onload=()=>{if(my!=token)return;const max=gl.getParameter(gl.MAX_TEXTURE_SIZE);let src=im;
      if(im.width>max){const c=document.createElement('canvas');c.width=max;c.height=max/2;c.getContext('2d').drawImage(im,0,0,c.width,c.height);src=c}
      gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,src);ready=true;ld.style.opacity=0;ask()};
    im.onerror=()=>{if(my==token){ld.style.opacity=1;ld.textContent="Rasm yuklanmadi. Qayta urinib ko'ring."}};im.src=url};

  if(e.target.closest('#cta')){e.preventDefault();e.target.closest('#cta').textContent="Sotuv bo'limi raqami shu yerda bo'ladi"}
});
$('view').addEventListener('keydown',e=>{const ap=e.target.closest('polygon[data-x]');if(ap&&(e.key=='Enter'||e.key==' ')){e.preventDefault();location.hash=`blok-${route.b}-q${route.f}-x${ap.dataset.x}`}});
$('view').addEventListener('change',e=>{const s=e.target.closest('select[data-k]');if(s)setStatus(s.dataset.k,s.value)});
$('lb').addEventListener('click',()=>$('lb').classList.remove('open'));
document.addEventListener('keydown',e=>{if(e.key=='Escape'){$('lb').classList.remove('open');closeBig()}});
/* bottom sheet: tap or drag the handle */
{const g=$('grab'),p=$('pane');let y0=null,moved=false;
 g.addEventListener('pointerdown',e=>{y0=e.clientY;moved=false;g.setPointerCapture(e.pointerId)});
 g.addEventListener('pointermove',e=>{if(y0!=null&&Math.abs(e.clientY-y0)>8)moved=true});
 g.addEventListener('pointerup',e=>{if(y0==null)return;const d=e.clientY-y0;y0=null;if(moved)p.classList.toggle('open',d<0);else p.classList.toggle('open');setTimeout(fit,470)});
 g.addEventListener('keydown',e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();p.classList.toggle('open');setTimeout(fit,470)}});
}
addEventListener('hashchange',()=>render(true));
addEventListener('resize',fit);
